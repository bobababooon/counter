<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>野手成績計算ツール</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: sans-serif;
  background: #f3f5f7;
  margin: 0;
  padding: 16px;
  color: #222;
}

.container {
  max-width: 850px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 25px;
}

h2 {
  font-size: 19px;
  margin-top: 24px;
}

.card {
  background: white;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 16px;
  box-shadow: 0 2px 6px #00000012;
}

button {
  border: none;
  border-radius: 8px;
  padding: 12px 8px;
  font-size: 15px;
  cursor: pointer;
  background: #e5e7eb;
  color: #222;
}

button:active {
  opacity: 0.7;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.hit {
  background: #d8f3dc;
}

.out {
  background: #e0e7ff;
}

.walk {
  background: #fef3c7;
}

.danger {
  background: #fee2e2;
}

.primary {
  background: #2563eb;
  color: white;
}

.secondary {
  background: #374151;
  color: white;
}

.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.stat {
  background: #f8fafc;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #e5e7eb;
}

.stat .label {
  font-size: 13px;
  color: #666;
}

.stat .value {
  font-size: 24px;
  font-weight: bold;
  margin-top: 5px;
  overflow-wrap: anywhere;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.toolbar button {
  flex: 1;
  min-width: 130px;
}

.history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  border-bottom: 1px solid #eee;
  padding: 10px 0;
}

.history-item:last-child {
  border-bottom: none;
}

.history-text {
  overflow-wrap: anywhere;
}

.history-item button {
  padding: 8px 12px;
  flex-shrink: 0;
}

.small {
  color: #666;
  font-size: 13px;
  line-height: 1.6;
}

.status {
  font-size: 13px;
  color: #15803d;
  margin-top: 8px;
}

input[type="file"] {
  display: none;
}

@media (min-width: 600px) {
  .stats {
    grid-template-columns: repeat(4, 1fr);
  }

  .buttons {
    grid-template-columns: repeat(4, 1fr);
  }
}
</style>
</head>

<body>
<div class="container">

<h1>⚾ 野手成績計算ツール</h1>

<div class="card">
  <h2>打席結果を記録</h2>

  <div class="buttons">
    <button class="hit" onclick="addResult('1B')">単打</button>
    <button class="hit" onclick="addResult('2B')">二塁打</button>
    <button class="hit" onclick="addResult('3B')">三塁打</button>
    <button class="hit" onclick="addResult('HR')">本塁打</button>

    <button class="walk" onclick="addResult('BB')">四球</button>
    <button class="walk" onclick="addResult('HBP')">死球</button>
    <button class="out" onclick="addResult('K')">三振</button>
    <button class="out" onclick="addResult('OUT')">アウト</button>

    <button onclick="addResult('E')">失策出塁</button>
    <button onclick="addResult('FC')">野選</button>
    <button onclick="addResult('SF')">犠飛</button>
    <button onclick="addResult('SH')">犠打</button>
  </div>

  <p class="small">
    打席結果を押すと記録され、成績が自動で更新されます。<br>
    犠飛・犠打は打数に含まれません。
  </p>
</div>

<div class="card">
  <h2>成績</h2>

  <div class="stats">
    <div class="stat">
      <div class="label">打率</div>
      <div class="value" id="avg">.000</div>
    </div>

    <div class="stat">
      <div class="label">出塁率</div>
      <div class="value" id="obp">.000</div>
    </div>

    <div class="stat">
      <div class="label">長打率</div>
      <div class="value" id="slg">.000</div>
    </div>

    <div class="stat">
      <div class="label">OPS</div>
      <div class="value" id="ops">.000</div>
    </div>

    <div class="stat">
      <div class="label">打席</div>
      <div class="value" id="pa">0</div>
    </div>

    <div class="stat">
      <div class="label">打数</div>
      <div class="value" id="ab">0</div>
    </div>

    <div class="stat">
      <div class="label">安打</div>
      <div class="value" id="hits">0</div>
    </div>

    <div class="stat">
      <div class="label">本塁打</div>
      <div class="value" id="hr">0</div>
    </div>

    <div class="stat">
      <div class="label">単打</div>
      <div class="value" id="singles">0</div>
    </div>

    <div class="stat">
      <div class="label">二塁打</div>
      <div class="value" id="doubles">0</div>
    </div>

    <div class="stat">
      <div class="label">三塁打</div>
      <div class="value" id="triples">0</div>
    </div>

    <div class="stat">
      <div class="label">四死球</div>
      <div class="value" id="walks">0</div>
    </div>

    <div class="stat">
      <div class="label">三振</div>
      <div class="value" id="strikeouts">0</div>
    </div>

    <div class="stat">
      <div class="label">犠飛</div>
      <div class="value" id="sf">0</div>
    </div>

    <div class="stat">
      <div class="label">犠打</div>
      <div class="value" id="sh">0</div>
    </div>

    <div class="stat">
      <div class="label">失策出塁</div>
      <div class="value" id="errors">0</div>
    </div>
  </div>
</div>

<div class="card">
  <h2>データ管理</h2>

  <div class="toolbar">
    <button class="secondary" onclick="undoLast()">直前の操作を取り消す</button>

    <button class="primary" onclick="exportCSV()">CSVを書き出す</button>

    <button class="primary" onclick="document.getElementById('csvFile').click()">
      CSVを読み込む
    </button>

    <button class="danger" onclick="resetAll()">全記録をリセット</button>
  </div>

  <input type="file" id="csvFile" accept=".csv,text/csv">

  <div class="status" id="saveStatus">保存準備完了</div>

  <p class="small">
    記録はこのブラウザ内に自動保存されます。<br>
    ブラウザのデータを消去すると、保存した記録も消える場合があります。
    大切な記録はCSVに書き出して保管してください。
  </p>
</div>

<div class="card">
  <h2>打席履歴</h2>
  <div id="history"></div>
</div>

</div>

<script>
const STORAGE_KEY = "fielder_stats_local_v1";

const LABELS = {
  "1B": "単打",
  "2B": "二塁打",
  "3B": "三塁打",
  "HR": "本塁打",
  "BB": "四球",
  "HBP": "死球",
  "K": "三振",
  "OUT": "アウト",
  "E": "失策出塁",
  "FC": "野選",
  "SF": "犠飛",
  "SH": "犠打"
};

let records = [];
let nextId = 1;
let previousState = null;

// ローカル保存から読み込む
function loadLocal() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);

    if (saved) {
      const data = JSON.parse(saved);

      if (Array.isArray(data.records)) {
        records = data.records;
      }

      if (Number.isInteger(data.nextId)) {
        nextId = data.nextId;
      } else {
        nextId = getNextId();
      }
    }
  } catch (error) {
    console.error("保存データの読み込みに失敗しました", error);
    records = [];
    nextId = 1;
  }

  render();
}

// ローカル保存
function saveLocal() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify({
        records: records,
        nextId: nextId
      })
    );

    document.getElementById("saveStatus").textContent =
      "✓ 自動保存済み";
  } catch (error) {
    document.getElementById("saveStatus").textContent =
      "保存できませんでした。CSVに書き出してください。";

    console.error("保存に失敗しました", error);
  }
}

// 次に使用するID
function getNextId() {
  if (records.length === 0) return 1;

  return Math.max(...records.map(r => Number(r.id) || 0)) + 1;
}

// 操作前の状態を保存
function rememberState() {
  previousState = {
    records: JSON.parse(JSON.stringify(records)),
    nextId: nextId
  };
}

// 打席結果を追加
function addResult(result) {
  if (!LABELS[result]) return;

  rememberState();

  records.push({
    id: nextId++,
    result: result,
    time: new Date().toISOString()
  });

  render();
}

// 直前の操作を取り消す
function undoLast() {
  if (!previousState) {
    alert("取り消せる操作がありません。");
    return;
  }

  const restore = previousState;

  previousState = null;
  records = restore.records;
  nextId = restore.nextId;

  render();
}

// 指定した記録を削除
function deleteRecord(id) {
  const index = records.findIndex(r => r.id === id);

  if (index === -1) return;

  rememberState();
  records.splice(index, 1);

  render();
}

// 全記録をリセット
function resetAll() {
  if (records.length === 0) {
    alert("記録はありません。");
    return;
  }

  if (!confirm("すべての記録を削除しますか？")) {
    return;
  }

  rememberState();

  records = [];
  nextId = 1;

  render();
}

// 成績を計算
function calculate() {
  const c = {
    PA: 0,
    AB: 0,
    H: 0,
    singles: 0,
    doubles: 0,
    triples: 0,
    HR: 0,
    BB: 0,
    HBP: 0,
    K: 0,
    SF: 0,
    SH: 0,
    E: 0,
    FC: 0,
    TB: 0
  };

  for (const record of records) {
    const r = record.result;

    switch (r) {
      case "1B":
        c.PA++;
        c.AB++;
        c.H++;
        c.singles++;
        c.TB += 1;
        break;

      case "2B":
        c.PA++;
        c.AB++;
        c.H++;
        c.doubles++;
        c.TB += 2;
        break;

      case "3B":
        c.PA++;
        c.AB++;
        c.H++;
        c.triples++;
        c.TB += 3;
        break;

      case "HR":
        c.PA++;
        c.AB++;
        c.H++;
        c.HR++;
        c.TB += 4;
        break;

      case "BB":
        c.PA++;
        c.BB++;
        break;

      case "HBP":
        c.PA++;
        c.HBP++;
        break;

      case "K":
        c.PA++;
        c.AB++;
        c.K++;
        break;

      case "OUT":
        c.PA++;
        c.AB++;
        break;

      case "E":
        c.PA++;
        c.AB++;
        c.E++;
        break;

      case "FC":
        c.PA++;
        c.AB++;
        c.FC++;
        break;

      case "SF":
        c.PA++;
        c.SF++;
        break;

      case "SH":
        c.SH++;
        break;
    }
  }

  const avg = c.AB > 0 ? c.H / c.AB : 0;

  const obpDenominator =
    c.AB + c.BB + c.HBP + c.SF;

  const obp = obpDenominator > 0
    ? (c.H + c.BB + c.HBP) / obpDenominator
    : 0;

  const slg = c.AB > 0 ? c.TB / c.AB : 0;

  const ops = obp + slg;

  return {
    ...c,
    avg,
    obp,
    slg,
    ops
  };
}

// 打率などを表示
function formatRate(value) {
  return value.toFixed(3).replace(/^0/, "");
}

// 画面を更新
function render() {
  const c = calculate();

  document.getElementById("avg").textContent =
    formatRate(c.avg);

  document.getElementById("obp").textContent =
    formatRate(c.obp);

  document.getElementById("slg").textContent =
    formatRate(c.slg);

  document.getElementById("ops").textContent =
    c.ops.toFixed(3);

  document.getElementById("pa").textContent = c.PA;
  document.getElementById("ab").textContent = c.AB;
  document.getElementById("hits").textContent = c.H;
  document.getElementById("hr").textContent = c.HR;

  document.getElementById("singles").textContent =
    c.singles;

  document.getElementById("doubles").textContent =
    c.doubles;

  document.getElementById("triples").textContent =
    c.triples;

  document.getElementById("walks").textContent =
    c.BB + c.HBP;

  document.getElementById("strikeouts").textContent =
    c.K;

  document.getElementById("sf").textContent = c.SF;
  document.getElementById("sh").textContent = c.SH;

  document.getElementById("errors").textContent = c.E;

  renderHistory();
  saveLocal();
}

// 履歴表示
function renderHistory() {
  const history = document.getElementById("history");

  history.innerHTML = "";

  if (records.length === 0) {
    history.innerHTML =
      '<p class="small">まだ記録がありません。</p>';
    return;
  }

  const reversed = [...records].reverse();

  for (const record of reversed) {
    const item = document.createElement("div");
    item.className = "history-item";

    const text = document.createElement("div");
    text.className = "history-text";

    const date = new Date(record.time);

    const timeText = isNaN(date.getTime())
      ? ""
      : date.toLocaleString("ja-JP");

    text.textContent =
      LABELS[record.result] + "　" + timeText;

    const button = document.createElement("button");
    button.className = "danger";
    button.textContent = "削除";

    button.onclick = () => {
      deleteRecord(record.id);
    };

    item.appendChild(text);
    item.appendChild(button);

    history.appendChild(item);
  }
}

// CSVのセルをエスケープ
function escapeCSV(value) {
  const str = String(value ?? "");

  return '"' + str.replace(/"/g, '""') + '"';
}

// CSVを書き出す
function exportCSV() {
  const header = ["id", "result", "time"];

  const lines = [
    header.map(escapeCSV).join(",")
  ];

  for (const record of records) {
    lines.push([
      record.id,
      record.result,
      record.time
    ].map(escapeCSV).join(","));
  }

  // Excelで日本語が文字化けしにくいようBOMを追加
  const csv = "\uFEFF" + lines.join("\r\n");

  const blob = new Blob(
    [csv],
    { type: "text/csv;charset=utf-8;" }
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "野手成績.csv";

  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
}

// CSVの1行を解析
function parseCSVLine(line) {
  const values = [];
  let current = "";
  let quoted = false;

  for (let i = 0; i < line.length; i++) {
    const ch = line[i];

    if (ch === '"') {
      if (quoted && line[i + 1] === '"') {
        current += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (ch === "," && !quoted) {
      values.push(current);
      current = "";
    } else {
      current += ch;
    }
  }

  values.push(current);

  return values;
}

// CSVを読み込む
document.getElementById("csvFile").addEventListener(
  "change",
  async function(event) {
    const file = event.target.files[0];

    if (!file) return;

    try {
      let text = await file.text();

      // BOMを取り除く
      text = text.replace(/^\uFEFF/, "");

      const lines = text
        .split(/\r?\n/)
        .filter(line => line.trim() !== "");

      if (lines.length < 1) {
        alert("CSVファイルが空です。");
        return;
      }

      const header = parseCSVLine(lines[0])
        .map(v => v.trim().toLowerCase());

      const idIndex = header.indexOf("id");
      const resultIndex = header.indexOf("result");
      const timeIndex = header.indexOf("time");

      if (resultIndex === -1) {
        alert(
          "CSVの形式が違います。\n" +
          "このツールで書き出したCSVを使用してください。"
        );
        return;
      }

      const imported = [];
      let importedNextId = getNextId();

      for (let i = 1; i < lines.length; i++) {
        const row = parseCSVLine(lines[i]);

        const result = row[resultIndex];

        if (!LABELS[result]) {
          continue;
        }

        const rawId = idIndex === -1
          ? null
          : Number(row[idIndex]);

        const id = Number.isInteger(rawId) && rawId > 0
          ? rawId
          : importedNextId;

        const time = timeIndex === -1 || !row[timeIndex]
          ? new Date().toISOString()
          : row[timeIndex];

        imported.push({
          id: id,
          result: result,
          time: time
        });

        importedNextId = Math.max(importedNextId, id + 1);
      }

      if (imported.length === 0) {
        alert("読み込める打席記録がありませんでした。");
        return;
      }

      const replace = confirm(
        "CSVから " + imported.length + " 件の記録を読み込みます。\n\n" +
        "「OK」：現在の記録を置き換える\n" +
        "「キャンセル」：現在の記録に追加する"
      );

      rememberState();

      if (replace) {
        records = imported;
      } else {
        const existingIds = new Set(records.map(r => r.id));

        for (const record of imported) {
          let newId = record.id;

          // 既存IDとの重複を避ける
          if (existingIds.has(newId)) {
            newId = getNextId();
          }

          records.push({
            ...record,
            id: newId
          });

          existingIds.add(newId);
        }
      }

      nextId = getNextId();

      render();

      alert(imported.length + " 件の記録を読み込みました。");

    } catch (error) {
      console.error(error);
      alert("CSVの読み込みに失敗しました。");
    }

    event.target.value = "";
  }
);

// 起動時に前回のデータを復元
loadLocal();
</script>
</body>
</html>
